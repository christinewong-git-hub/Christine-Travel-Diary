<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的旅行日記應用程式</title>
</head>
<body>
    <h1>旅行日記 - 登入及資料測試</h1>

    <script type="module">
        // 1. 匯入基礎 Firebase SDKs 和您將使用的服務
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-analytics.js";
        // 匯入常用的服務：Firestore (資料庫) 和 Auth (認證)
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


        // 2. 您的 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyCeFnypnf5WdO9mIsuwLwGZIsEv123QcuM",
            authDomain: "my-travel-diary-1dbc0.firebaseapp.com",
            projectId: "my-travel-diary-1dbc0",
            storageBucket: "my-travel-diary-1dbc0.firebasestorage.app",
            messagingSenderId: "592971246262",
            appId: "1:592971246262:web:f7d0c923b697a26e199417",
            measurementId: "G-F6X3YWL2MY"
        };


        // 3. 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // 4. 初始化並導出服務實例，供其他模組或程式碼使用
        const db = getFirestore(app); // Firestore 資料庫
        const auth = getAuth(app); // 認證服務

        console.log("Firebase 應用程式已初始化！");
        console.log("Firestore 實例:", db);
        console.log("Auth 實例:", auth);


        // --- 簡易功能測試範例 (可移除) ---
        // 嘗試寫入一筆資料到 Firestore
        async function addSamplePost() {
            try {
                const docRef = await addDoc(collection(db, "posts"), {
                    title: "我的第一篇日記",
                    city: "台北",
                    date: new Date(),
                    content: "這是一個測試用的日記條目。",
                    author: "測試用戶"
                });
                console.log("文件寫入成功，ID:", docRef.id);
            } catch (e) {
                console.error("寫入文件時發生錯誤:", e);
            }
        }
        
        // 可以在頁面載入後呼叫這個函數來測試資料庫連線
        // addSamplePost(); 
        // ------------------------------------

    </script>
</body>
</html>
